name: Split CppCoreGuidelines

on:
  push:
    branches:
      - master
    paths:
      - "CppCoreGuidelines.md"
      - "scripts/python/split_guidelines.py"
  workflow_dispatch:

jobs:
  split-guidelines:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: ls
        run: |
          ls
          ls ./scripts/python/split_guidelines.py


      - name: Split markdown file into section files
        run: python ./scripts/python/split_guidelines.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guidelines
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Split CppCoreGuidelines.md into section files"
            git push
          fi
